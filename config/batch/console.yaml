apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: aibrix-system
spec:
  selector:
    app: console
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50060
      targetPort: 50060
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: aibrix-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      containers:
        - name: console
          image: console:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTH_MODE
              value: dev
            - name: DEV_MODE
              value: "true"
            - name: HTTP_ADDR
              value: :8080
            - name: GRPC_ADDR
              value: :50060
            - name: STORE_URI
              value: sqlite:/tmp/aibrix-console.db
            - name: METADATA_SERVICE_URL
              value: http://aibrix-metadata-service.aibrix-system.svc.cluster.local:8090
            - name: METRICS_PROMETHEUS_ENABLED
              value: "true"
            - name: METRICS_SERVICE_NAME
              value: aibrix-console
            - name: KUBERNETES_NAMESPACE
              value: default
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50060
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

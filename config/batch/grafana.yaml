apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: aibrix-system
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: aibrix-batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: aibrix-batch
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: data
          emptyDir: {}
        - name: datasources
          configMap:
            name: batch-grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: aibrix-system
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: aibrix-batch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-service
  namespace: aibrix-system
spec:
  template:
    spec:
      containers:
        - name: metadata-service
          env:
            - name: REDIS_HOST
              value: aibrix-redis-master
            - name: REDIS_PORT
              value: "6379"
            - name: METRICS_PROMETHEUS_ENABLED
              value: "true"
            - name: AIBRIX_HTTPX_CLIENT_TELEMETRY_ENABLED
              value: "true"
            - name: AIBRIX_HTTPX_CLIENT_TELEMETRY_INTERVAL_SECONDS
              value: "5"
            - name: AIBRIX_JSON_PROFILER_TELEMETRY_ENABLED
              value: "true"
            - name: AIBRIX_JSON_PROFILER_TELEMETRY_INTERVAL_SECONDS
              value: "5"
            - name: AIBRIX_BATCH_TELEMETRY_INTERVAL_SECONDS
              value: "5"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-service
  namespace: aibrix-system
spec:
  template:
    spec:
      containers:
        - name: metadata-service
          env:
            - name: METRICS_OPENTSDB_ADDR
              value: aibrix-opentsdb.aibrix-system.svc.cluster.local:4242

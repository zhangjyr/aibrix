apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-service
  namespace: aibrix-system
spec:
  template:
    spec:
      containers:
        - name: metadata-service
          env:
            - name: STORAGE_AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key-id
            - name: STORAGE_AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-access-key
            - name: STORAGE_AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: region
            - name: STORAGE_AWS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: bucket-name
            - name: STORAGE_AWS_ENDPOINT_URL
              value: http://aibrix-minio.aibrix-system.svc.cluster.local:9000

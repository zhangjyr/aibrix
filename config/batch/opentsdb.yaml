apiVersion: v1
kind: Service
metadata:
  name: opentsdb
  namespace: aibrix-system
spec:
  selector:
    app: opentsdb
  ports:
    - name: http
      port: 4242
      targetPort: 4242
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentsdb-config
  namespace: aibrix-system
data:
  opentsdb.conf: |
    tsd.network.port = 4242
    tsd.http.staticroot = /usr/local/share/opentsdb/static/
    tsd.http.cachedir = /tmp/opentsdb
    tsd.core.plugin_path = /opentsdb-plugins
    tsd.core.auto_create_metrics = true
    tsd.core.meta.enable_realtime_ts = true
    tsd.storage.max_tags = 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentsdb
  namespace: aibrix-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentsdb
  template:
    metadata:
      labels:
        app: opentsdb
    spec:
      containers:
        - name: opentsdb
          image: opentsdb
          volumeMounts:
            - name: opentsdb-config
              mountPath: /etc/opentsdb/opentsdb.conf
              subPath: opentsdb.conf
          ports:
            - name: http
              containerPort: 4242
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
      volumes:
        - name: opentsdb-config
          configMap:
            name: opentsdb-config

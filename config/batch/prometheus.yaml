# This local overlay deploys a plain Prometheus instance because the existing
# config/prometheus base only contributes a ServiceMonitor. That base is useful
# with Prometheus Operator, but it does not create a runnable Prometheus stack
# by itself for local batch setup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: aibrix-system
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: aibrix-batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: aibrix-batch
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: batch-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: aibrix-system
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: aibrix-batch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aibrix.metadata.serviceAccountName" . }}
  annotations:
    {{- toYaml .Values.metadata.serviceAccount.annotations | nindent 4 }}
  labels:
    {{- include "aibrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aibrix-metadata-service
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aibrix.fullname" . }}-metadata-service-reader
  labels:
    {{- include "aibrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aibrix-metadata-service
rules:
  # Read pods to get base models
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Read ModelAdapter CRDs to get adapter models
  - apiGroups: ["model.aibrix.ai"]
    resources: ["modeladapters"]
    verbs: ["get", "list"]
  # For batch job execution (K8sJobRuntime creates/polls/deletes Jobs in-process)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # For batch deployment execution (DeploymentRuntime creates/polls/deletes Deployments/Services in-process)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  # For in-cluster EndpointSlice-backed dispatch endpoint discovery.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aibrix.fullname" . }}-metadata-service-reader
  labels:
    {{- include "aibrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aibrix-metadata-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aibrix.fullname" . }}-metadata-service-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "aibrix.metadata.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

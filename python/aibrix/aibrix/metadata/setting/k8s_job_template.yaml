apiVersion: batch/v1
kind: Job
metadata:
  name: batch-job-template
  namespace: default
  labels:
    app: aibrix-batch
    component: batch-processor
  annotations:
    # Template annotations will be merged with BatchJobSpec annotations
spec:
  template:
    metadata:
      labels:
        app: aibrix-batch
        component: batch-processor
    spec:
      serviceAccountName: job-reader-sa
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
      - name: batch-worker
        image: aibrix/runtime:nightly
        command:
          - aibrix_batch_worker
        env:
        - name: JOB_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['job-name']
        - name: JOB_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      - name: llm-engine
        image: aibrix/vllm-mock:nightly
        ports:
          - containerPort: 8000
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: 8000
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        env:
          - name: MY_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
  backoffLimit: 3
  activeDeadlineSeconds: 86400  # 24 hours
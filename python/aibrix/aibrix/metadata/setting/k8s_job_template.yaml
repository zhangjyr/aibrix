apiVersion: batch/v1
kind: Job
metadata:
  name: batch-job-template
  namespace: default
  labels:
    app: aibrix-batch
    component: batch-processor
  annotations:
    # Template annotations will be merged with BatchJobSpec annotations
spec:
  template:
    metadata:
      labels:
        app: aibrix-batch
        component: batch-processor
    spec:
      serviceAccountName: job-reader-sa
      automountServiceAccountToken: true
      shareProcessNamespace: true # Allow worker to kill llm-engine
      restartPolicy: OnFailure
      containers:
      - name: batch-worker
        image: aibrix/runtime:nightly
        command:
          - aibrix_batch_worker
        env:
        - name: JOB_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['job-name']
        - name: JOB_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      - name: llm-engine
        image: aibrix/vllm-mock:nightly
        ports:
          - containerPort: 8000
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Run llm engine. The '|| true' at the end ensures this line never fails.
            WORKER_VICTIM=1 python app.py || true
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: 8000
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
  backoffLimit: 3
  activeDeadlineSeconds: 86400  # 24 hours